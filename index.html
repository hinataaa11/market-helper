<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d8c3a5">
<meta name="color-scheme" content="light">
<meta name="application-name" content="賣場對帳小幫手">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="賣場對帳小幫手">

<title>賣場對帳小幫手</title>

<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">

<style>
*{box-sizing:border-box}

html,body{
  width:100%;
  height:100%;
  margin:0;
  background:#f7f2eb;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;
  overflow:hidden;
}

#app{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  border:0;
  background:#fff;
}

#loading{
  position:fixed;
  inset:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#f7f2eb;
  transition:opacity .25s ease;
}

#loading.hide{
  opacity:0;
  pointer-events:none;
}

.box{
  text-align:center;
  padding:24px;
}

.box img{
  width:76px;
  height:76px;
  border-radius:18px;
  object-fit:cover;
  box-shadow:0 8px 24px rgba(0,0,0,.12);
}

.title{
  font-weight:800;
  font-size:18px;
  margin-top:14px;
  color:#443a31;
}

.sub{
  font-size:13px;
  color:#786b60;
  margin-top:6px;
}

/* 備援提示：改到上方，不擋底部操作 */
#fallback{
  display:none;
  position:fixed;
  top:max(14px,env(safe-area-inset-top));
  left:14px;
  right:14px;
  z-index:30;
  background:rgba(255,255,255,.97);
  border:1px solid #e7ddd2;
  border-radius:16px;
  padding:14px 42px 14px 14px;
  box-shadow:0 10px 30px rgba(0,0,0,.12);
  color:#443a31;
}

#fallback.show{
  display:block;
}

#fallback .fallback-title{
  font-weight:800;
  font-size:14px;
  margin-bottom:5px;
}

#fallback .fallback-text{
  font-size:13px;
  line-height:1.5;
  color:#786b60;
}

#fallback a{
  display:inline-block;
  margin-top:10px;
  padding:9px 12px;
  border-radius:10px;
  text-align:center;
  text-decoration:none;
  background:#5d4b3d;
  color:#fff;
  font-weight:700;
  font-size:13px;
}

#fallback .close{
  position:absolute;
  top:8px;
  right:10px;
  border:0;
  background:transparent;
  color:#786b60;
  font-size:21px;
  line-height:1;
  padding:4px;
  cursor:pointer;
}
</style>
</head>

<body>

<div id="loading">
  <div class="box">
    <img src="./icon-192.png" alt="">
    <div class="title">賣場對帳小幫手</div>
    <div class="sub">正在連線 Google Sheet…</div>
  </div>
</div>

<iframe
  id="app"
  title="賣場對帳小幫手"
  src="https://script.google.com/macros/s/AKfycbxvXhMqoMTLIkFiAQa1Heqd21rXmd9bWEwHOKpuLw8NbzvFddyJVRbnCuX7IozbYrF7oQ/exec"
  allow="clipboard-read; clipboard-write"
  referrerpolicy="strict-origin-when-cross-origin">
</iframe>

<div id="fallback">
  <button class="close" type="button" aria-label="關閉">×</button>
  <div class="fallback-title">如果畫面一直沒有載入</div>
  <div class="fallback-text">
    可能是 Apps Script 的登入／權限被瀏覽器擋住。
  </div>
  <a
    href="https://script.google.com/macros/s/AKfycbxvXhMqoMTLIkFiAQa1Heqd21rXmd9bWEwHOKpuLw8NbzvFddyJVRbnCuX7IozbYrF7oQ/exec"
    target="_blank"
    rel="noopener">
    直接開啟對帳系統
  </a>
</div>

<script>
const frame = document.getElementById('app');
const loading = document.getElementById('loading');
const fallback = document.getElementById('fallback');
const closeBtn = fallback.querySelector('.close');

let loaded = false;

/* 只有真的超過 12 秒還沒載入，才顯示備援 */
const fallbackTimer = setTimeout(() => {
  if (!loaded) {
    loading.classList.add('hide');
    fallback.classList.add('show');
  }
}, 12000);

/* iframe 成功載入後，取消備援計時器 */
frame.addEventListener('load', () => {
  loaded = true;
  clearTimeout(fallbackTimer);
  fallback.classList.remove('show');

  setTimeout(() => {
    loading.classList.add('hide');
  }, 250);
});

closeBtn.addEventListener('click', () => {
  fallback.classList.remove('show');
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>

</body>
</html>
