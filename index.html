<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#d8c3a5">
  <meta name="color-scheme" content="light">
  <meta name="application-name" content="賣場對帳小幫手">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="賣場對帳小幫手">
  <title>賣場對帳小幫手</title>

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">

  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;background:#f7f2eb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;overflow:hidden}
    #app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
    #loading{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:#f7f2eb;transition:opacity .25s ease}
    #loading.hide{opacity:0;pointer-events:none}
    .box{text-align:center;padding:24px}
    .box img{width:76px;height:76px;border-radius:18px;object-fit:cover;box-shadow:0 8px 24px rgba(0,0,0,.12)}
    .title{font-weight:800;font-size:18px;margin-top:14px;color:#443a31}
    .sub{font-size:13px;color:#786b60;margin-top:6px}
    #fallback{display:none;position:fixed;left:14px;right:14px;bottom:max(14px,env(safe-area-inset-bottom));z-index:30;background:#fff;border:1px solid #e7ddd2;border-radius:16px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.12);color:#443a31}
    #fallback.show{display:block}
    #fallback a{display:block;margin-top:10px;padding:11px 14px;border-radius:10px;text-align:center;text-decoration:none;background:#5d4b3d;color:#fff;font-weight:700}
  </style>
</head>
<body>
  <div id="loading">
    <div class="box">
      <img src="./icon-192.png" alt="">
      <div class="title">賣場對帳小幫手</div>
      <div class="sub">正在連線 Google Sheet…</div>
    </div>
  </div>

  <iframe
    id="app"
    title="賣場對帳小幫手"
    src="https://script.google.com/macros/s/AKfycbxvXhMqoMTLIkFiAQa1Heqd21rXmd9bWEwHOKpuLw8NbzvFddyJVRbnCuX7IozbYrF7oQ/exec"
    allow="clipboard-read; clipboard-write"
    referrerpolicy="strict-origin-when-cross-origin">
  </iframe>

  <div id="fallback">
    如果畫面一直沒有載入，可能是 Apps Script 的登入／權限被瀏覽器擋住。
    <a href="https://script.google.com/macros/s/AKfycbxvXhMqoMTLIkFiAQa1Heqd21rXmd9bWEwHOKpuLw8NbzvFddyJVRbnCuX7IozbYrF7oQ/exec" target="_blank" rel="noopener">直接開啟對帳系統</a>
  </div>

  <script>
    const frame = document.getElementById('app');
    const loading = document.getElementById('loading');
    const fallback = document.getElementById('fallback');

    frame.addEventListener('load', () => {
      setTimeout(() => loading.classList.add('hide'), 250);
    });

    setTimeout(() => {
      loading.classList.add('hide');
      fallback.classList.add('show');
    }, 12000);

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
